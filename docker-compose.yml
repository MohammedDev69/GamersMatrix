services:
  postgres:
    image: postgres:16-alpine
    container_name: gamersmatrix-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gamers
      POSTGRES_PASSWORD: gamers
      POSTGRES_DB: gamersmatrix
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
